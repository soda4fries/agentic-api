            \ -> -1  ✓ (expected -1)\n  ```\n\n### 2. Maximum Subarray — LeetCode\
            \ 53\n- **Algorithm:** Kadane's algorithm (single-pass DP). Track `cur\
            \ = max(x, cur + x)` (extend vs. restart) and `best` = global max. **O(n)**\
            \ time, **O(1)** space.\n- **Implementation:**\n  ```python\n  def max_subarray(nums):\n\
            \      best = cur = nums[0]\n      for x in nums[1:]:\n          cur =\
            \ max(x, cur + x)\n          best = max(best, cur)\n      return best\n\
            \  ```\n- **Sources:** https://leetcode.com/problems/maximum-subarray/\
            \ · https://algo.monster/liteproblems/53\n- **Actual output (executed):**\n\

            - **Algorithm:** **Stack (LIFO).** Push opening brackets; on a closing\
            \ bracket, the stack must be non-empty and its top must be the matching\
            \ opener (else invalid). Valid iff the stack is empty at the end. **O(n)**\
            \ time, **O(n)** space.\n- **Implementation:**\n  ```python\n  def is_valid(s):\n\
            \      stack = []\n      pairs = {')': '(', ']': '[', '}': '{'}\n    \
            \  for ch in s:\n          if ch in pairs.values():\n              stack.append(ch)\n\
            \          else:\n              if not stack or stack.pop() != pairs[ch]:\n\
            \                  return False\n      return not stack\n  ```\n- **Sources:**\
            \ https://leetcode.com/problems/valid-parentheses/ · https://neetcode.io/solutions/valid-parentheses\
            \ · https://algo.monster/liteproblems/20\n- **Actual output (executed):**\n\

            \ n)** time, **O(1)** space.\n- **Implementation:**\n  ```python\n  def\
            \ binary_search(nums, target):\n      left, right = 0, len(nums) - 1\n\
            \      while left <= right:\n          mid = (left + right) // 2\n   \
            \       if nums[mid] == target:\n              return mid\n          elif\
            \ nums[mid] < target:\n              left = mid + 1\n          else:\n\
            \              right = mid - 1\n      return -1\n  ```\n- **Sources:**\
            \ https://leetcode.com/problems/binary-search/ · https://algo.monster/liteproblems/704\n\
            - **Actual output (executed):**\n  ```\n  Example 1: nums=[-1,0,3,5,9,12],\

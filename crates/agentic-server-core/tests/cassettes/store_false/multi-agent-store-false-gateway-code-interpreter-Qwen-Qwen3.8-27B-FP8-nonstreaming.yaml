            \ True    (bonus)\n  ```\n\n### 4. Longest Substring Without Repeating\
            \ Characters — LeetCode 3\n- **Algorithm:** **Sliding window + hash map**\
            \ of last-seen index. Maintain window `[left, right]`; if `s[right]` was\
            \ last seen at an index ≥ `left`, advance `left` past the duplicate; track\
            \ max window length. **O(n)** time, **O(min(n, alphabet))** space.\n-\

            ### Problem 1: Valid Parentheses — LeetCode 20\n\n- **Algorithm/technique:**\
            \ **Stack (LIFO)**. Iterate left-to-right. On an opening bracket, push\
            \ it. On a closing bracket, the stack must be non-empty and its top must\
            \ be the matching opener — pop if so, else invalid. After the loop, the\
            \ string is valid iff the stack is empty. O(n) time, O(n) space.\n- **Source\
            \ URL(s):**\n  - https://leetcode.com/problems/valid-parentheses/\n  -\
            \ https://neetcode.io/solutions/valid-parentheses\n  - https://algo.monster/liteproblems/20\n\
            - **Implementation (Python):**\n```python\ndef is_valid(s: str) -> bool:\n\
            \    stack = []\n    pairs = {')': '(', ']': '[', '}': '{'}\n    for ch\
            \ in s:\n        if ch in pairs.values():\n            stack.append(ch)\n\
            \        else:\n            if not stack or stack.pop() != pairs[ch]:\n\
            \                return False\n    return not stack\n```\n- **Inputs run\
            \ → ACTUAL output (from code_interpreter):**\n```\nis_valid(\"()\")  \
            \ = True\nis_valid(\"(]\")   = False\nis_valid(\"{[]}\") = True\nis_valid(\"\
            \")     = True\n```\nThe two canonical checks passed: `\"()\"` → `True`\
            \ and `\"(]\"` → `False` (and bonus `{[]}` → `True`, `\"\"` → `True`).\n\
            \n---\n\n### Problem 2: Longest Substring Without Repeating Characters\
            \ — LeetCode 3\n\n- **Algorithm/technique:** **Sliding window + hash map\
            \ (last-seen index)**. Maintain a window `[left, right]`. For each `right`,\
            \ if `s[right]` was last seen at an index ≥ `left`, advance `left` past\
            \ that duplicate. Track the max window length. O(n) time, O(min(n, alphabet))\
            \ space.\n- **Source URL(s):**\n  - https://leetcode.com/problems/longest-substring-without-repeating-characters/\n\
            \  - https://pcoroneos.com/blog/leetcode/3-longest-substring-without-repeating-characters/\n\
            \  - https://algo.monster/liteproblems/3\n- **Implementation (Python):**\n\
            ```python\ndef length_of_longest_substring(s: str) -> int:\n    last =\
            \ {}\n    left = 0\n    best = 0\n    for right, ch in enumerate(s):\n\
            \        if ch in last and last[ch] >= left:\n            left = last[ch]\
            \ + 1\n        best = max(best, right - left + 1)\n        last[ch] =\
            \ right\n    return best\n```\n- **Inputs run → ACTUAL output (from code_interpreter):**\n\

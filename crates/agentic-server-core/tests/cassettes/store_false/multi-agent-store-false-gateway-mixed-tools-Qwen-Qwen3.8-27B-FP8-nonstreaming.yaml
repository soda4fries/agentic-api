          text: '


            I now have sufficient information from multiple sources. Here''s my summary:


            ---


            ## Tiktoken Encoding & Decoding — Summary


            ### Overview

            `tiktoken` is a fast BPE (Byte Pair Encoding) tokenizer developed by OpenAI.
            The core tokenization API lives in `tiktoken/core.py` and is centered
            around the `Encoding` class, which wraps a high-performance Rust `CoreBPE`
            implementation.


            ### Getting an Encoding


            ```python

            import tiktoken


            # By encoding name

            enc = tiktoken.get_encoding("cl100k_base")    # GPT-4 / GPT-3.5-Turbo

            enc = tiktoken.get_encoding("o200k_base")     # GPT-4o


            # By model name (auto-maps to the correct encoding)

            enc = tiktoken.encoding_for_model("gpt-4o")

            ```


            ### Encoding (Text → Token IDs)


            **Primary method:** `enc.encode(text)`


            ```python

            import tiktoken

            enc = tiktoken.get_encoding("o200k_base")


            # Basic encode: str → list[int]

            token_ids = enc.encode("hello world")

            # e.g. [15339, 198]

            ```


            **Parameters:**

            | Parameter | Type | Description |


            ## 1. Python `csv` Module Documentation

            *(from csv_docs)*


            **URL:** https://docs.python.org/3/library/csv.html


            The `csv` module implements classes to read and write tabular data in
            CSV format.


            **Main classes/functions:**


            | Name | Description |

            |------|-------------|

            | `csv.reader` | Iterator that reads rows from a CSV file |

            | `csv.writer` | Writes rows of data to a CSV file |

            | `csv.DictReader` | Maps each row to a dict keyed by field names |

            | `csv.DictWriter` | Maps dicts to CSV output |

            | `csv.Error` | Base exception for csv errors |

            | `csv.field_size_limit` | Get/set the upper bound for field sizes |

            | `csv.Sniffer` | Auto-detects dialect parameters from a sample |

            | `csv.Dialect` | Base class for custom dialects |


            **Common parameters:** `dialect` (default `''excel''`), `delimiter` (default
            `'',''`), `quotechar` (default `''"''`), `quoting`, `lineterminator` (default
            `''\r\n''`), `doublequote`, `skipinitialspace`, `restval`, `restkey`.


            > **Tip:** Open file objects with `newline=''''` since the module handles
            newlines internally.


            ---


            ## 2. Tiktoken Encoding & Decoding

            *(from tiktoken_lookup)*


            **Getting an encoding:**

            ```python

            import tiktoken

            enc = tiktoken.get_encoding("cl100k_base")       # by name

            enc = tiktoken.encoding_for_model("gpt-4o")       # by model name

            ```


            **Encoding text → tokens:**

            ```python

            tokens = enc.encode("hello world")  # returns list of int token IDs

            ```


            **Decoding tokens → text:**

            ```python

            text = enc.decode(tokens)  # returns string

            assert enc.decode(enc.encode("hello world")) == "hello world"  # round-trip

            ```


            **Common encoding names:** `gpt2`, `r50k_base`, `p50k_base`, `cl100k_base`
            (GPT-3.5/4 era), `o200k_base` (GPT-4o era).


            **Other notes:**

            - BPE-based, lossless, ~1 token ≈ 4 bytes average

            - 3–6× faster than HuggingFace `GPT2TokenizerFast`

            - Custom encodings can be created or registered via `tiktoken_ext` plugin
            mechanism

            - Full API lives in `tiktoken/core.py` (not indexed by the search tool)



            ## 1. Python csv Module Documentation


            **Official docs:** https://docs.python.org/3/library/csv.html


            **Main classes & functions:**


            | Name | Description |

            |------|-------------|

            | `csv.reader(csvfile, ...)` | Returns a reader object; each row is a
            list of strings |

            | `csv.writer(csvfile, ...)` | Returns a writer object; use `.writerow()`
            / `.writerows()` |

            | `csv.DictReader(csvfile, fieldnames=None, ...)` | Rows as dicts; fieldnames
            optional (inferred from first row) |

            | `csv.DictWriter(f, fieldnames, ...)` | Writes dicts as rows; **fieldnames
            is required**; has `.writeheader()` |

            | `csv.Dialect` | Container for formatting params; register via `csv.register_dialect()`
            |

            | `csv.field_size_limit()` | Get/set max field size (default 128 KB) |


            **Key gotchas:**

            - **Always open files with `newline=''''`** to avoid double blank lines
            on Windows

            - `DictWriter` requires `fieldnames` explicitly (unlike `DictReader`)

            - `None` values are written as empty strings

            - Don''t build CSV manually — use the module (handles quoting automatically)

            - `strict=True` raises `csv.Error` on malformed input


            ---


            ## 2. tiktoken Encoding & Decoding


            **Basic usage:**

            ```python

            import tiktoken

            enc = tiktoken.get_encoding("o200k_base")


            # Encode text → token IDs

            tokens = enc.encode("hello world")


            # Decode token IDs → text

            text = enc.decode(tokens)


            # Round-trip is guaranteed lossless

            assert enc.decode(enc.encode("hello world")) == "hello world"

            ```


            **Main functions:**


            | Function | Purpose |

            |----------|---------|

            | `tiktoken.get_encoding(name)` | Get a named encoding (`"o200k_base"`,
            `"cl100k_base"`, `"gpt2"`, etc.) |

            | `tiktoken.encoding_for_model(model)` | Get the tokeniser for a specific
            OpenAI model |

            | `tiktoken.Encoding(...)` | Construct a custom `Encoding` object |

            | `Encoding.encode(text)` | Tokenise text → list of token IDs |

            | `Encoding.decode(ids)` | Token IDs → text |


            **Notable facts:**

            - BPE is reversible and lossless

            - Average compression: ~4 bytes of text per token

            - 3–6× faster than `GPT2TokenizerFast`

            - Can extend via `tiktoken_ext` plugin namespace packages



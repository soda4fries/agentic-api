            \n### 1. Getting an Encoding Object\n\nTwo main approaches:\n\n```python\n\
            import tiktoken\n\n# By encoding name:\nenc = tiktoken.get_encoding(\"\
            o200k_base\")\n\n# By model name (resolves to the appropriate encoding):\n\
            enc = tiktoken.encoding_for_model(\"gpt-4o\")\n```\n\n### 2. Encoding\

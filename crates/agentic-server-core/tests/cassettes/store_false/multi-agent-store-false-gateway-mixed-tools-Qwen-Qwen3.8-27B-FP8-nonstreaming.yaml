            \ IDs.\n\n```python\ntokens = enc.encode(\"hello world\")\n```\n\n###\
            \ 3. Decoding Tokens → Text\n\nMethod: `enc.decode(tokens)` — takes a\
            \ list of token IDs, returns a string.\n\n```python\ntext = enc.decode(tokens)\n\
            # The README asserts round-trip correctness:\nassert enc.decode(enc.encode(\"\
            hello world\")) == \"hello world\"\n```\n\n### 4. Common Encoding Names\
            \ (from README)\n\n| Name | Context |\n|------|---------|\n| `o200k_base`\
            \ | Used in the primary example (modern GPT-4o era) |\n| `cl100k_base`\

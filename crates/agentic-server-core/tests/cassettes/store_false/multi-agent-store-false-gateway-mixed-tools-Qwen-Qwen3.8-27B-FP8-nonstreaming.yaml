            ## tiktoken Encoding & Decoding — Documentation Findings


            ### How to Encode Text into Tokens


            ```python

            import tiktoken

            enc = tiktoken.get_encoding("o200k_base")

            tokens = enc.encode("hello world")

            ```


            ### How to Decode Tokens Back into Text


            ```python

            text = enc.decode(tokens)

            # Round-trip guarantee:

            assert enc.decode(enc.encode("hello world")) == "hello world"

            ```


            ### Main Encoding Classes & Functions


            | Function / Class | Purpose |

            |---|---|

            | `tiktoken.get_encoding(name)` | Retrieve a named encoding (e.g. `"o200k_base"`,
            `"cl100k_base"`, `"gpt2"`) |

            | `tiktoken.encoding_for_model(model)` | Get the tokeniser corresponding
            to a specific OpenAI model (e.g. `"gpt-4o"`) |

            | `tiktoken.Encoding(name, pat_str, mergeable_ranks, special_tokens)`
            | Construct a custom `Encoding` object directly |

            | `Encoding.encode(text)` | Tokenise text into a list of token IDs |

            | `Encoding.decode(token_ids)` | Convert token IDs back to text |


            The full tokeniser API is documented in `tiktoken/core.py` (referenced
            by the README but not separately indexed in the docs tool).


            ### Educational Submodule


            ```python

            from tiktoken._educational import *


            # Train a BPE tokeniser on small text

            enc = train_simple_encoding()


            # Visualise how the GPT-4 encoder encodes text

            enc = SimpleBytePairEncoding.from_tiktoken("cl100k_base")

            enc.encode("hello world aaaaaaaaaaaa")

            ```


            ### Extending tiktoken (Custom Encodings)


            Two approaches:

            1. **Direct construction** — Build an `Encoding` object with the desired
            `name`, `pat_str`, `mergeable_ranks`, and `special_tokens`, then pass
            it around.

            2. **Plugin mechanism** — Create a namespace package under `tiktoken_ext`
            with a module containing an `ENCODING_CONSTRUCTORS` dict (mapping encoding
            name → constructor function returning `Encoding` kwargs). Install with
            `pip install ./my_tiktoken_extension` (not editable).


            ### Notable Caveats & Facts


            - **BPE is reversible and lossless** — encode/decode round-trips perfectly.

            - **Compression ratio**: On average each token ≈ 4 bytes of original text.

            - **Special tokens**: If you change the special token set, use a different
            encoding name so behaviour is clear.

            - **Private attributes**: In production, load arguments directly rather
            than accessing private attributes like `_pat_str` or `_mergeable_ranks`
            (though the example in the README does show this pattern).

            - **Performance**: tiktoken is 3–6× faster than `GPT2TokenizerFast` from
            `tokenizers==0.13.2`.

            - **Plugin install**: Do **not** use an editable install for `tiktoken_ext`
            plugins.

            - **Example notebook**: The OpenAI Cookbook has a detailed how-to at `github.com/openai/openai-cookbook/blob/main/examples/How_to_count_tokens_with_tiktoken.ipynb`.



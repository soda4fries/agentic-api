            \n---\n\n## Python `csv` Module Documentation\n\n### 1. URL\n**https://docs.python.org/3/library/csv.html**\n\
            \n### 2. Purpose\nThe `csv` module implements classes to read and write\
            \ tabular data in CSV (Comma Separated Values) format. CSV is the most\
            \ common import/export format for spreadsheets and databases. The module\
            \ provides an efficient way to manipulate such data, hiding the details\
            \ of reading and writing from the programmer while supporting variations\
            \ in delimiters and quoting characters.\n\n> **Note:** File objects should\
            \ be opened with `newline=''` since the `csv` module does its own (universal)\
            \ newline handling.\n\n### 3. Main Classes and Functions\n\n| Class /\
            \ Function | Description |\n|---|---|\n| `csv.reader(fileobj, dialect,\
            \ **fmtparams)` | Returns an iterator that reads rows of data from a CSV\
            \ file (iterates over lists of strings). |\n| `csv.writer(fileobj, dialect,\
            \ **fmtparams)` | Returns an object that writes rows of data to a CSV\
            \ file; accepts `write()`, `writerow()`, and `writerows()`. |\n| `csv.DictReader(fileobj,\
            \ fieldnames=None, dialect='excel', **fmtparams)` | Maps each input row\
            \ to a dictionary whose keys are field names (header row). |\n| `csv.DictWriter(fileobj,\
            \ fieldnames, dialect='excel', **fmtparams)` | Maps dictionaries to CSV\
            \ output, keyed by field names. |\n| `csv.Error` | Base exception class\
            \ for all `csv` module errors (e.g., `csv.Error: field larger than field\
            \ limit`). |\n| `csv.field_size_limit([new_limit])` | Get or set the upper\
            \ bound for field sizes; raises `Error` if a field exceeds the limit.\
            \ |\n| `csv.Sniffer` | Class that \"sniffs\" (auto-detects) dialect parameters\

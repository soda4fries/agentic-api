          text: "\n\n## Python `csv` Module — Summary\n\n**Source:** [https://docs.python.org/3/library/csv.html](https://docs.python.org/3/library/csv.html)\n\
            \n### Main Purpose\n\nThe `csv` module (part of the Python standard library,\
            \ since 2.3) provides tools for reading and writing CSV (Comma Separated\
            \ Values) files. CSV is the most common import/export format for spreadsheets\
            \ and databases. The module supports both sequence-based and dictionary-based\
            \ access patterns.\n\n### Key Functions & Classes\n\n| Function / Class\
            \ | Description |\n|---|---|\n| `csv.reader(fileobj, dialect='excel',\
            \ **kwds)` | Returns an iterator that reads rows from a CSV file as **lists**.\
            \ Each row is a list of strings. |\n| `csv.writer(fileobj, dialect='excel',\
            \ **kwds)` | Returns a writer object that writes **sequences** (lists/tuples)\
            \ as CSV rows. Key methods: `.writerow(row)` and `.writerows(rows)`. |\n\
            | `csv.DictReader(f, fieldnames=None, restkey=None, restval=None, dialect='excel',\
            \ **kwds)` | Reads CSV rows as **ordered dictionaries**, using the first\
            \ row as column headers by default. Access data by key name (`row['name']`)\
            \ instead of index. |\n| `csv.DictWriter(f, fieldnames, restval='', extrasaction='raise',\
            \ dialect='excel', **kwds)` | Writes **dictionaries** as CSV rows. `fieldnames`\
            \ is **required**. Key methods: `.writeheader()`, `.writerow(dict)`, `.writerows(iterable_of_dicts)`.\
            \ |\n\n### Common Use Cases\n\n- **Reading spreadsheet exports** into\
            \ Python for data processing\n- **Exporting data** (from databases, APIs,\
            \ computed results) to CSV for interchange\n- **Filtering / transforming**\
            \ tabular data (e.g., filter rows by a condition, write a subset)\n- **Quick\
            \ ETL** between CSV and JSON formats\n\n### Notable Parameters & Best\
            \ Practices\n\n| Parameter | Notes |\n|---|---|\n| `delimiter` | Defaults\
            \ to `','`. Use `';'` for locale-specific files (e.g., European Excel).\
            \ |\n| `quoting` / `quotechar` | Controls when quotes are generated (`QUOTE_MINIMAL`,\
            \ `QUOTE_ALL`, `QUOTE_NONE`, `QUOTE_NONNUMERIC`). |\n| `skipinitialspace`\
            \ | When `True`, whitespace after the delimiter is ignored. |\n| `doublequote`\
            \ | When `True` (default), the quotechar is doubled to escape it. |\n\
            | `restval` / `restkey` (DictReader) | `restval` fills missing fields;\
            \ `restkey` is the dict key for extra values beyond the fieldnames. |\n\
            | `extrasaction` (DictWriter) | `'raise'` (default) raises `ValueError`\
            \ for extra keys; `'ignore'` silently drops them. |\n| `dialect` | A named\
            \ or custom dialect bundles defaults (e.g., `'excel'`). |\n| `csv.field_size_limit`\
            \ / `set_field_size_limit` | Controls the maximum number of characters\
            \ in a single field (default 128 KB). |\n\n**Best practices:**\n\n1. **Always\
            \ pass `newline=''`** to `open()` when using the csv module. The module\
            \ handles its own line-ending logic; omitting it can cause blank lines\
            \ on Windows.\n2. **Specify `encoding='utf-8'`** for predictable cross-platform\
            \ results.\n3. **Use `DictReader`/`DictWriter`** when column order or\
            \ naming matters — more readable and less error-prone than index-based\
            \ access.\n4. **Use a `with` block** to ensure files are properly closed.\n\
            5. **Set `field_size_limit`** if dealing with very large fields (e.g.,\
            \ embedded JSON in a CSV column).\n\n### Example (DictWriter)\n\n```python\n\
            import csv\n\nwith open('names.csv', 'w', newline='', encoding='utf-8')\
            \ as f:\n    fieldnames = ['first_name', 'last_name']\n    writer = csv.DictWriter(f,\
            \ fieldnames=fieldnames)\n    writer.writeheader()\n    writer.writerow({'first_name':\
            \ 'Baked', 'last_name': 'Beans'})\n```\n\n### Source URL(s)\n\n- https://docs.python.org/3/library/csv.html\
            \ (official docs)"

          text: "\n\nI have all the information needed. Here is my report:\n\n---\n\
            \n## Python csv Module Documentation — Findings\n\n### Official Docs URL\n\
            **https://docs.python.org/3/library/csv.html**\n\n(Source code: `Lib/csv.py`\
            \ in the CPython repository)\n\n---\n\n### Summary of Main Classes & Functions\n\
            \n| Name | Description |\n|------|-------------|\n| **`csv.reader(csvfile,\
            \ dialect='excel', **fmtparams)`** | Returns a reader object that processes\
            \ lines from `csvfile`. Each row is returned as a **list** of strings.\
            \ `csvfile` is most commonly a file-like object or a list of strings.\
            \ |\n| **`csv.writer(csvfile, dialect='excel', **fmtparams)`** | Returns\
            \ a writer object that writes CSV rows to `csvfile`. Use `.writerow(row)`\
            \ or `.writerows(rows)` to write. |\n| **`csv.DictReader(csvfile, fieldnames=None,\
            \ restkey=None, restval=None, dialect='excel', **kwds)`** | Like `reader`,\
            \ but each row is a **dict** mapping header names to values. `fieldnames`\
            \ is *optional* — if not given, it is inferred from the first row (via\
            \ `.fieldnames`). |\n| **`csv.DictWriter(f, fieldnames, restval='', extrasaction='raise',\
            \ **kwds)`** | Writes dicts as rows. **`fieldnames` is required** (unlike\
            \ `DictReader`). Has a `.writeheader()` method. `extrasaction` can be\
            \ `'raise'` (default) or `'ignore'`. |\n| **`csv.Dialect`** | Container\
            \ class for formatting parameters (`delimiter`, `quotechar`, `quoting`,\
            \ `doublequote`, `skipinitialspace`, `strict`, `lineterminator`, `escapechar`).\
            \ Subclass it or register with `csv.register_dialect()`. |\n| **Quoting\
            \ constants** | `QUOTE_MINIMAL` (default), `QUOTE_ALL`, `QUOTE_NONE`,\
            \ `QUOTE_NONNUMERIC`, and **`QUOTE_NOTNULL`** (new in 3.12 — treats empty\
            \ unquoted strings as `None`). |\n| **`csv.field_size_limit([new_limit])`**\
            \ | Get or set the maximum allowed field size (default 128 KB). |\n| **`csv.register_dialect(name,\
            \ dialect)` / `csv.getreader(name)` / `csv.getwriter(name)` / `csv.list_dialects()`**\
            \ | Utility functions for managing dialects. |\n| **`csv.Error`** | Exception\
            \ raised on malformed input (when `strict=True`). |\n\n---\n\n### Notable\
            \ Usage Tips & Gotchas (from the docs)\n\n1. **Always open files with\
            \ `newline=''`.**\n   > *\"If `csvfile` is a file object, it should be\
            \ opened with `newline=''`, since the csv module does its own (universal)\
            \ newline handling.\"*\n   Without this, you'll get **double blank lines\
            \ on Windows** because Python's universal newline translation interferes\
            \ with the csv module's line handling. This is the single most common\
            \ csv bug.\n\n2. **`DictWriter.fieldnames` is mandatory.**\n   Unlike\
            \ `DictReader` (where it defaults to the first row), `DictWriter` requires\
            \ you to explicitly pass `fieldnames`. This is because the dict's key\
            \ order alone isn't sufficient to determine column order.\n\n3. **`None`\
            \ is written as the empty string.**\n   To make DB-API interop easy, `None`\
            \ values are silently converted to `''` when writing.\n\n4. **Quoting\
            \ is handled automatically.**\n   The writer automatically quotes fields\
            \ containing the delimiter, quote character, or line terminator. The docs\
            \ emphasize you should **not** build CSV strings manually with f-strings\
            \ or concatenation — that breaks with embedded commas/quotes.\n\n5. **Dialects\
            \ group formatting parameters.**\n   You can pass a dialect name (string)\
            \ or a `Dialect` subclass instance to any reader/writer, and also override\
            \ individual parameters as keyword arguments (e.g., `delimiter=';'`, `quoting=csv.QUOTE_ALL`).\n\
            \n6. **`strict=True` for validation.**\n   Setting `strict=True` causes\
            \ `csv.Error` to be raised on bad CSV input (e.g., malformed quoting),\
            \ rather than silently producing wrong data.\n\n7. **`restval` and `restkey`\
            \ for ragged rows.**\n   - `restval`: value assigned to missing fields\
            \ when a row is shorter than expected.\n   - `restkey`: key under which\
            \ extra values are collected (as a list) when a row is longer than expected.\n\
            \n8. **The module does not directly handle encoding/decoding.**\n   It\
            \ works with strings. You must open files with the correct `encoding`\
            \ (e.g., `utf-8`, `utf-8-sig`) in the `open()` call. In Python 2 it was\
            \ 8-bit-clean but had issues with ASCII NUL characters; Python 3 handles\
            \ this via normal str I/O."
